name: build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The test target uses Swift Testing (Swift 6.0+ / Xcode 16+) and
      # SwiftTerm's manifest also needs a recent toolchain. Select the newest
      # installed Xcode 16 explicitly rather than relying on the runner default,
      # which has historically been an older Xcode on the macos-14 image.
      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      # PROBLEMS.md ISSUE-030: fail CI on any new warning. Scoped to the
      # `swift build` step only (the main RemminaMac target, currently
      # warning-free) rather than Package.swift's target settings or the
      # test step — the test target's former deprecated-accessor warnings
      # are gone (call sites now use the throwing accessor), but the test
      # step still runs without -warnings-as-errors to avoid failing CI
      # on warnings from third-party test dependencies.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test
